name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Run unit tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
        env:
          # 每 fork 独立限堆 1g 由 build.gradle.kts 配置；CI 上按核数调大并行
          GRADLE_TEST_PARALLEL_FORKS: '4'
